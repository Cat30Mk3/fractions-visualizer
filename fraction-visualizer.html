from pathlib import Path

html = """<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fraction Visualizer</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
    text-align:center;
    margin:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

.controls{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
	<div>
  Fraction A<br>
  <input id="n1" type="number" value="1"> /
  <input id="d1" type="number" value="1">
</div>

<div>
  Operator<br>
  <select id="op">
    <option value="+">+</option>
    <option value="-">-</option>
    <option value="*">×</option>
  </select>
</div>

<div>
  Fraction B<br>
  <input id="n2" type="number" value="1"> /
  <input id="d2" type="number" value="1">
</div>

<h2 id="fractionLabel">Result</h2>k
	
}

input{
    width:90px;
    font-size:24px;
    padding:8px;
    margin:10px;
    text-align:center;
}

button{
    font-size:22px;
    padding:10px 20px;
    margin-top:15px;
}

.canvasRow{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:40px;
    margin-top:30px;
}

.canvasBox{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
}

canvas{
    border:2px solid #444;
    background:white;
}

h2{
    margin-top:0;
}
</style>
</head>

<body>

<div class="container">

<div class="controls">
    <h1>Fraction Visualizer</h1>

    <div>
        Numerator<br>
        <input id="numerator" type="number" min="0" value="1">
    </div>

    <div>
        Denominator<br>
        <input id="denominator" type="number" min="1" value="4">
    </div>

    <button onclick="drawFraction()">Draw Fraction</button>

    <h2 id="fractionLabel">1 / 4</h2>
</div>

<div class="canvasRow">

    <div class="canvasBox">
        <h2>Pie Fraction</h2>
        <canvas id="pieCanvas" width="320" height="320"></canvas>
    </div>

    <div class="canvasBox">
        <h2>Rectangle Fill</h2>
        <canvas id="barCanvas" width="180" height="420"></canvas>
    </div>

</div>

</div>

<script>

function drawFraction(){

  const n1 = +document.getElementById("n1").value;
  const d1 = +document.getElementById("d1").value;
  const n2 = +document.getElementById("n2").value;
  const d2 = +document.getElementById("d2").value;
  const op = document.getElementById("op").value;

  if(d1<=0 || d2<=0){ alert("Denominators > 0"); return; }

  let num, den;

  if(op === "+"){
    num = n1*d2 + n2*d1;
    den = d1*d2;
  }
  else if(op === "-"){
    num = n1*d2 - n2*d1;
    den = d1*d2;
  }
  else if(op === "*"){
    num = n1*n2;
    den = d1*d2;
  }

  // simplify (optional)
  const g = gcd(Math.abs(num), Math.abs(den));
  num /= g; den /= g;

  document.getElementById("fractionLabel").innerHTML =
    `${n1}/${d1} ${op} ${n2}/${d2} = ${num}/${den}`;

  drawPie(num, den);
  drawBar(num, den);
}

function gcd(a,b){ return b ? gcd(b, a%b) : a; }

function drawPie(num, den){

    const canvas = document.getElementById("pieCanvas");
    const ctx = canvas.getContext("2d");

    ctx.clearRect(0,0,canvas.width,canvas.height);

    const fullCircles = Math.floor(num / den);
    const remainder = num % den;

    const radius = 50;
    const spacing = 130;

    for(let c = 0; c < fullCircles + (remainder > 0 ? 1 : 0); c++){

        const centerX = 70 + c * spacing;
        const centerY = 160;

        const slices = (c < fullCircles) ? den : remainder;
        const totalSlices = den;

        const angleSize = (Math.PI * 2) / totalSlices;

        for(let i = 0; i < totalSlices; i++){

            const startAngle = (-Math.PI / 2) + (i * angleSize);
            const endAngle = startAngle + angleSize;

            ctx.beginPath();
            ctx.moveTo(centerX, centerY);

            ctx.arc(centerX, centerY, radius, startAngle, endAngle);
            ctx.closePath();

            if(i < slices){
                ctx.fillStyle = "dodgerblue";
            } else {
                ctx.fillStyle = "#dddddd";
            }

            ctx.fill();
            ctx.stroke();
        }
    }
}

function drawBar(num, den){

    const canvas = document.getElementById("barCanvas");
    const ctx = canvas.getContext("2d");

    ctx.clearRect(0,0,canvas.width,canvas.height);

    const fullBars = Math.floor(num / den);
    const remainder = num % den;

    const barWidth = 40;
    const spacing = 20;
    const height = 300;
    const y = 50;

    for(let b = 0; b < fullBars + (remainder > 0 ? 1 : 0); b++){

        const x = 30 + b * (barWidth + spacing);

        ctx.strokeRect(x, y, barWidth, height);

        let fillFraction = (b < fullBars) ? 1 : remainder / den;

        ctx.fillStyle = "dodgerblue";

        ctx.fillRect(
            x,
            y + height - (height * fillFraction),
            barWidth,
            height * fillFraction
        );

        // divider lines
        for(let i = 1; i < den; i++){
            const yy = y + (height / den) * i;
            ctx.beginPath();
            ctx.moveTo(x, yy);
            ctx.lineTo(x + barWidth, yy);
            ctx.strokeStyle = "#666";
            ctx.stroke();
        }
    }
}

</script>

</body>
</html>
"""

path = Path("/mnt/data/fraction_visualizer_fixed.html")
path.write_text(html, encoding="utf-8")

print("Saved fixed HTML file:", path)
